name            = "settliq-status"
main            = "worker.js"
compatibility_date = "2024-01-01"
account_id      = "YOUR_CLOUDFLARE_ACCOUNT_ID"

# Serve status.settliq.xyz
routes = [
  { pattern = "status.settliq.xyz/*", zone_name = "settliq.xyz" }
]

# Inline the HTML at deploy time — no external fetch needed
[text_blobs]
STATUS_HTML = "index.html"

# Environment variables
[vars]
API_ORIGIN = "https://api.settliq.xyz"

# Production environment overrides (if needed)
[env.production]
vars = { API_ORIGIN = "https://api.settliq.xyz" }
